<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心愿足迹 - 结构化同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --danger: #f43f5e; --bg: #020617; }
        body { background: var(--bg); color: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #map { width: 100%; height: 100%; background: #020617; }
        
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        .leaflet-tooltip {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            opacity: 1 !important;
        }

        .tip-card {
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            width: 320px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            pointer-events: none;
            animation: fadeIn 0.2s ease-out;
            overflow: hidden;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .tip-accent { width: 100%; height: 3px; }
        .tip-body { padding: 16px 20px; }
        .tip-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
        .tip-content { font-size: 13px; line-height: 1.6; color: #94a3b8; white-space: pre-wrap; word-break: break-all; }

        .admin-area { border-top: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.95); }
        .btn-action { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; font-size: 11px; font-weight: 700; padding: 10px; border-radius: 12px; transition: 0.2s; }
        .btn-action:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .tree-ct-title { color: #3b82f6; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; padding: 1.5rem 0 0.5rem 0; }
        .tree-cy-box { border-left: 1px solid #1e293b; margin-left: 4px; padding-left: 12px; margin-bottom: 12px; }
        .tree-cy-name { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; }

        #modalOverlay { background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; position: fixed; inset: 0; backdrop-filter: blur(10px); }
        .modal-card { width: 480px; max-width: 90vw; background: #0f172a; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1); transform: scale(0.95); opacity: 0; transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .active .modal-card { transform: scale(1); opacity: 1; }
        
        /* 新增：选中状态类 */
        .star-btn { transition: 0.2s; }
        .star-btn.active-star { background: #ca8a04; color: #fff; }
    </style>
</head>
<body class="flex">

    <aside class="w-80 h-full flex flex-col z-[1000] glass shrink-0">
        <div class="p-8 shrink-0">
            <h1 class="text-2xl font-extrabold tracking-tighter">FOOTPRINT</h1>
            <p class="text-[9px] text-blue-500 mt-1 uppercase tracking-widest font-black">Structured Edition</p>
        </div>

        <div class="px-8 space-y-3 mb-6 shrink-0">
            <input id="searchInput" type="text" placeholder="输入目的地并回车..." 
                onkeypress="if(event.key==='Enter') doSearch()"
                class="w-full bg-slate-900 border border-white/10 rounded-2xl py-4 px-5 text-sm text-white focus:border-blue-500 outline-none transition-all">
            
            <div class="flex items-center gap-2 bg-slate-900 p-2 rounded-2xl border border-white/5">
                <button onclick="setFilter(0)" class="flex-1 text-[10px] py-2 rounded-xl transition-all hover:bg-slate-800">全部</button>
                <button onclick="setFilter(3)" class="flex-1 text-[10px] py-2 rounded-xl transition-all hover:bg-slate-800">★★★</button>
                <button onclick="setFilter(2)" class="flex-1 text-[10px] py-2 rounded-xl transition-all hover:bg-slate-800">★★</button>
                <button onclick="setFilter(1)" class="flex-1 text-[10px] py-2 rounded-xl transition-all hover:bg-slate-800">★</button>
            </div>
            
            <button onclick="doSearch()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-blue-900/40 transition-all">
                添加新足迹
            </button>
        </div>

        <div id="wishlist" class="flex-1 overflow-y-auto custom-scroll px-8 pb-4"></div>

        <div class="p-6 admin-area shrink-0">
            <div class="grid grid-cols-2 gap-2 mb-3">
                <button onclick="exportHTML()" class="btn-action flex items-center justify-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    导出 HTML
                </button>
                <button onclick="confirmClear()" class="btn-action hover:text-rose-400">
                    清空数据
                </button>
            </div>
            <p class="text-[8px] text-center text-slate-500 font-medium">支持多设备离线数据同步</p>
        </div>
    </aside>

    <main class="flex-1 relative">
        <div id="map"></div>
    </main>

    <div id="modalOverlay" onclick="closeModal()">
        <div class="modal-card p-10" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <div id="mTypeLabel" class="text-[9px] font-black uppercase mb-1 px-2 py-0.5 rounded inline-block">TYPE</div>
                    <h2 id="mTitle" class="text-3xl font-extrabold text-white">地点名称</h2>
                </div>
                <button onclick="closeModal()" class="text-slate-500 hover:text-white text-xl">✕</button>
            </div>
            <div class="flex gap-2 mb-4" id="starSelector">
                <button id="s1" onclick="setStar(1)" class="star-btn px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">★</button>
                <button id="s2" onclick="setStar(2)" class="star-btn px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">★★</button>
                <button id="s3" onclick="setStar(3)" class="star-btn px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">★★★</button>
            </div>
            <textarea id="mMemo" placeholder="在这里记下你的故事、攻略或心情..." 
                class="w-full bg-slate-950 border border-white/10 rounded-2xl p-5 text-sm h-48 mb-6 focus:border-blue-500 outline-none text-slate-200 leading-relaxed"></textarea>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="saveData()" class="bg-blue-600 py-4 rounded-2xl font-bold hover:bg-blue-500 transition-all">保存备注</button>
                <button onclick="deleteLoc()" class="bg-slate-800 py-4 rounded-2xl font-bold text-slate-400 hover:text-rose-400 transition-all">删除此点</button>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'FOOTPRINT_STRUCT_V1';
        const EMBEDDED_PAYLOAD = []; 

        let locations = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentFilter = 0;
        let tempStar = 1;

        if (locations.length === 0 && EMBEDDED_PAYLOAD.length > 0) {
            locations = EMBEDDED_PAYLOAD;
            localStorage.setItem(DB_KEY, JSON.stringify(locations));
        }

        const CONTINENT_MAP = { 'Asia':'亚洲','Europe':'欧洲','North America':'北美洲','South America':'南美洲','Africa':'非洲','Oceania':'大洋洲','Other':'其他' };
        let map, layers = {}, currentId = null;

        window.onload = () => {
            map = L.map('map', { zoomControl: false, minZoom: 2, attributionControl: false }).setView([25, 110], 4);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { noWrap: true }).addTo(map);
            locations.forEach(loc => drawOnMap(loc));
            renderList();
        };

        function drawOnMap(loc) {
            let layer;
            const color = (loc.type === 'capital') ? '#f43f5e' : '#3b82f6';
            if (loc.type === 'country' && loc.geojson) {
                layer = L.geoJSON(loc.geojson, { style: { color: color, weight: 1.5, fillColor: color, fillOpacity: 0.15 } }).addTo(map);
            } else {
                layer = L.circleMarker([loc.lat, loc.lng], { radius: loc.type === 'capital' ? 8 : 6, fillColor: color, color: '#fff', weight: 2, fillOpacity: 1 }).addTo(map);
            }
            layer.bindTooltip(createTipHTML(loc), { direction: 'top', offset: [0, -10], sticky: true, opacity: 1 });
            layer.on('click', () => openModal(loc.id));
            layers[loc.id] = layer;
        }

        function createTipHTML(loc) {
            const color = loc.type === 'capital' ? '#f43f5e' : '#3b82f6';
            const starText = '★'.repeat(loc.star || 1);
            return `<div class="tip-card"><div class="tip-accent" style="background: ${color}"></div><div class="tip-body"><div class="tip-title"><span>${loc.name}</span><span style="color: #fbbf24">${starText}</span></div><div class="tip-content">${loc.memo || '无备注'}</div></div></div>`;
        }

        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if(!q) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&polygon_geojson=1&addressdetails=1&limit=1`);
                const data = await res.json();
                if(data.length > 0) {
                    const it = data[0];
                    const addr = it.address;
                    let type = (it.place_rank <= 4 || it.addresstype === 'country') ? 'country' : (addr.capital === 'yes' ? 'capital' : 'place');
                    const newLoc = { id: Date.now(), name: it.display_name.split(',')[0], type: type, lat: parseFloat(it.lat), lng: parseFloat(it.lon), geojson: type === 'country' ? it.geojson : null, country: addr.country || '其他', continent: detectContinent(addr.country_code), memo: '', star: 1 };
                    locations.push(newLoc);
                    save();
                    drawOnMap(newLoc);
                    renderList();
                    openModal(newLoc.id);
                    document.getElementById('searchInput').value = '';
                }
            } catch(e) { console.error(e); }
        }

        function setFilter(s) { currentFilter = s; renderList(); }
        function setStar(s) { 
            tempStar = s; 
            document.querySelectorAll('.star-btn').forEach(btn => btn.classList.remove('active-star'));
            document.getElementById('s' + s).classList.add('active-star');
        }

        function renderList() {
            const box = document.getElementById('wishlist');
            box.innerHTML = '';
            const filtered = currentFilter === 0 ? locations : locations.filter(l => l.star === currentFilter);
            const tree = {};
            filtered.forEach(l => {
                const ct = l.continent || 'Other';
                const cy = l.country || '其他';
                if(!tree[ct]) tree[ct] = {};
                if(!tree[ct][cy]) tree[ct][cy] = [];
                tree[ct][cy].push(l);
            });
            Object.keys(tree).sort().forEach(ct => {
                const ctEl = document.createElement('div');
                ctEl.className = 'tree-ct-title';
                ctEl.innerText = CONTINENT_MAP[ct] || ct;
                box.appendChild(ctEl);
                Object.keys(tree[ct]).sort().forEach(cy => {
                    const cyBox = document.createElement('div');
                    cyBox.className = 'tree-cy-box';
                    cyBox.innerHTML = `<div class="tree-cy-name">${cy}</div>`;
                    tree[ct][cy].sort((a,b) => b.star - a.star).forEach(loc => {
                        const el = document.createElement('div');
                        el.className = 'flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 cursor-pointer transition-all text-xs text-slate-300';
                        el.onclick = () => { map.panTo([loc.lat, loc.lng]); openModal(loc.id); };
                        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${loc.type === 'capital' ? 'bg-rose-500' : 'bg-blue-500'}"></span><span class="truncate flex-1">${loc.name}</span><span class="text-[8px] text-yellow-500">${'★'.repeat(loc.star)}</span>`;
                        cyBox.appendChild(el);
                    });
                    box.appendChild(cyBox);
                });
            });
        }

        function detectContinent(code) {
            const eu = ['at','be','bg','hr','cy','cz','dk','ee','fi','fr','de','gr','hu','ie','it','lv','lt','lu','mt','nl','pl','pt','ro','sk','si','es','se','gb','is','no','ch','ru','ua'];
            const as = ['cn','jp','kr','in','id','th','vn','sg','my','ph','ae','sa','tr','il','pk','bd','tw','hk'];
            const na = ['us','ca','mx','gl','cu','pa','cr'];
            const sa = ['br','ar','cl','co','pe','ve','ec'];
            const af = ['za','eg','ng','ke','ma','et'];
            const oc = ['au','nz','fj'];
            const c = code?.toLowerCase();
            if(eu.includes(c)) return 'Europe'; if(as.includes(c)) return 'Asia'; if(na.includes(c)) return 'North America'; if(sa.includes(c)) return 'South America'; if(af.includes(c)) return 'Africa'; if(oc.includes(c)) return 'Oceania'; return 'Other';
        }

        function openModal(id) {
            currentId = id;
            const loc = locations.find(l => l.id === id);
            setStar(loc.star || 1);
            document.getElementById('mTitle').innerText = loc.name;
            document.getElementById('mMemo').value = loc.memo || '';
            const m = document.getElementById('modalOverlay');
            m.style.display = 'flex';
            setTimeout(() => m.classList.add('active'), 10);
        }

        function closeModal() {
            const m = document.getElementById('modalOverlay');
            m.classList.remove('active');
            setTimeout(() => { m.style.display = 'none'; currentId = null; }, 300);
        }

        function saveData() {
            const loc = locations.find(l => l.id === currentId);
            if(loc) {
                loc.memo = document.getElementById('mMemo').value;
                loc.star = tempStar;
                save();
                if(layers[currentId]) layers[currentId].setTooltipContent(createTipHTML(loc));
                closeModal();
                renderList();
            }
        }

        function deleteLoc() {
            if(!currentId) return;
            if(layers[currentId]) map.removeLayer(layers[currentId]);
            locations = locations.filter(l => l.id !== currentId);
            save();
            renderList();
            closeModal();
        }

        function save() { localStorage.setItem(DB_KEY, JSON.stringify(locations)); }

        function exportHTML() {
            const dataStr = JSON.stringify(locations);
            let htmlContent = document.documentElement.outerHTML;
            const newContent = htmlContent.replace(/const EMBEDDED_PAYLOAD = \[.*?\];/, `const EMBEDDED_PAYLOAD = ${dataStr};`);
            const blob = new Blob([newContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `WISH_MAP_EXPORT_${new Date().getTime()}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function confirmClear() {
            if (confirm("确定要永久清空所有足迹吗？建议先导出 HTML 进行备份。")) {
                locations = [];
                save();
                location.reload();
            }
        }
    </script>
</body>
</html>
